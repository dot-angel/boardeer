<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노은</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 홈페이지 전체 배경 이미지 레이어 (배너와 별개, 페이지 전체 뒤에 깔림) -->
  <div class="bg-image-layer" id="bgImageLayer"></div>

  <!-- 배너: 제목/잠금/테마 버튼이 전부 여기 하단에 함께 있어요 (별도 제목바 없음) -->
  <div class="site-banner" id="siteBanner">
    <div class="site-banner-scrim"></div>
    <div class="banner-bottom">
      <div class="banner-bottom-left">
        <div class="site-name-img" id="siteNameImg" role="img" aria-label="노은"></div>
      </div>
      <div class="banner-bottom-right">
        <span class="lock-badge" id="lockBadge">🔒 보기 전용</span>
        <button class="btn small" id="modeToggleBtn">☀️ 라이트모드</button>
        <button class="btn small" id="globalStyleBtn"><span class="icon-accent"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="6.5" cy="11.5" r="1.3"/><circle cx="9.5" cy="7.5" r="1.3"/><circle cx="14.5" cy="7.5" r="1.3"/><circle cx="17.5" cy="11.5" r="1.3"/></svg></span> 테마 편집</button>
        <button class="btn small banner-edit-btn" id="bannerEditBtn" style="display:none;">배너 이미지</button>
        <button class="btn small bg-edit-btn" id="bgEditBtn" style="display:none;">배경 이미지</button>
        <button class="btn small" id="lockBtn">잠금 해제</button>
      </div>
    </div>
  </div>

  <!-- 탭으로 나뉜 고정 레이아웃: 좌우로 슬라이드하면 탭이 넘어감. 위젯 제목은 전부 없앰(애플 위젯 스타일) -->
  <div class="board-tabs">
    <div class="board-tab-dots" id="boardTabNav">
      <button class="board-tab-dot active" type="button" data-tab="0" aria-label="위젯 탭"></button>
      <button class="board-tab-dot" type="button" data-tab="1" aria-label="갤러리 탭"></button>
    </div>
    <button class="board-tab-arrow prev disabled" type="button" id="boardTabPrev" aria-label="이전 탭">‹</button>
    <button class="board-tab-arrow next" type="button" id="boardTabNext" aria-label="다음 탭">›</button>

    <div class="board-viewport" id="boardViewport">

      <!-- 탭 1: 갤러리를 제외한 나머지 위젯들 -->
      <div class="board-page" data-page="0">
       <div class="board">

        <div class="row row-images">
          <div class="w-card w-images" id="cardImages"></div>
        </div>

        <div class="row row-strip">
          <div class="w-card w-music" id="cardMusic"></div>
          <div class="w-card w-profile" id="cardProfile"></div>
          <div class="row-strip-right">
            <div class="w-card w-guestbook gb-collapsed" id="cardGuestbook">
              <button class="gb-toggle" id="gbToggle" type="button" aria-expanded="false">
                <span>방명록</span>
                <span class="gb-toggle-arrow">▾</span>
              </button>
              <div class="w-body scroll" id="guestbookBody"></div>
              <div class="gb-form" id="guestbookForm">
                <input type="text" id="gbName" placeholder="이름">
                <textarea id="gbMsg" placeholder="메시지를 남겨주세요"></textarea>
                <button class="btn small primary" id="gbSubmit">남기기</button>
              </div>
            </div>
            <div class="w-card w-speech" id="cardSpeech"></div>
            <div class="w-card w-shaker" id="cardShaker">
              <div class="shaker-frame" id="shakerFrame">
                <div class="shaker-empty" id="shakerEmpty">아직 이미지가 없어요</div>
                <button class="icon-btn shaker-manage-btn" id="shakerManageBtn" title="이미지 관리" style="display:none;">✎</button>
              </div>
            </div>
          </div>
        </div>

        <div class="row row-2">
          <div class="w-card w-sessions" id="cardSessions">
            <div class="session-grid" id="sessionGrid"></div>
            <div class="w-edit-row" id="sessionAddWrap"></div>
          </div>
          <div class="row-2-right">
            <div class="w-card w-docs" id="cardDocs">
              <div class="tag-filter" id="docFilter" style="display:none;"></div>
              <div class="doc-list" id="docList"></div>
              <div class="w-edit-row" id="docAddWrap"></div>
            </div>
            <div class="w-card w-checklist" id="cardChecklist">
              <div class="checklist" id="checklistBody"></div>
              <div class="check-add-row" id="checklistAddWrap" style="display:none;"></div>
            </div>
          </div>
          <div class="w-card w-calendar" id="cardCalendar">
            <div class="cal-dday-strip w-dday" id="calDdayStrip">
              <div class="w-body" id="ddayBody"></div>
              <div class="w-edit-row" id="ddayAddWrap"></div>
            </div>
            <div class="cal-content" id="calContent"></div>
          </div>
        </div>

       </div>
      </div>

      <!-- 탭 2: 갤러리 위젯들 -->
      <div class="board-page" data-page="1">
       <div class="board">

        <div class="row row-3">
          <div class="w-card w-gallery" id="cardGallery"></div>
        </div>

        <div class="row row-refpair" id="refpairRow">
          <div class="w-card w-gallery" id="cardGallery2"></div>
          <div class="w-card w-refgallery" id="cardRefGallery"></div>
          <div class="w-card w-video" id="cardVideo">
            <div class="video-player" id="videoPlayer"></div>
            <div class="video-list" id="videoList"></div>
            <div class="w-edit-row" id="videoAddWrap"></div>
          </div>
        </div>

       </div>
      </div>

    </div>
  </div>

  <div id="modalRoot"></div>

  <!-- 라이트(사슴관)·다크(멧돼지관) 전환 연출용 도어 오버레이 -->
  <div class="door door-left" id="doorLeft"></div>
  <div class="door door-right" id="doorRight"></div>
  <div class="door-text" id="doorText"></div>

  <!-- Firebase (compat SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
